name: Build Mono Dash Self-Use APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bypass server limit for personal build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "lib/presentation/features/purchases/providers/purchase_provider.dart"
          )
          source = path.read_text()

          old = "static const bypassServerLimitCheck = false;"
          new = "static const bypassServerLimitCheck = true;"

          if old not in source:
              raise SystemExit("Target configuration was not found")

          path.write_text(source.replace(old, new, 1))
          print("Server limit bypass enabled.")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          mkdir -p android/keystore

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/keystore/mono-dash-release.jks

          printf '%s\n' \
            "storeFile=../keystore/mono-dash-release.jks" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/key.properties

          test -s android/keystore/mono-dash-release.jks
          test -s android/key.properties

          echo "Android signing key restored."

      - name: Build optimized ARM64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mono-dash-self-use-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
